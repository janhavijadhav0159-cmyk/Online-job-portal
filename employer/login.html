<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employer Login - Job Portal</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/employer.css">
</head>

<body>

<header class="user-header">

    <div class="header-inner">

        <div class="logo">JobPortal</div>

        <nav class="nav">
            <a href="../index.html">Home</a>
            <a href="../jobs.html">Jobs</a>
            <a href="../companies.html">Companies</a>
            <a href="../about.html">About</a>
            <a href="../contact.html">Contact</a>

            <a href="register.html" class="join-btn">
                Register
            </a>
        </nav>

    </div>

</header>

<main class="auth-container">

    <div class="auth-box">

        <h1>Employer Login</h1>

        <p class="auth-subtitle">
            Login to manage your jobs
        </p>

        <form id="employerLoginForm">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmployerEmail"
                    placeholder="Enter email"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginEmployerPassword"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button type="submit" class="primary-btn">
                Login
            </button>

        </form>

        <p class="auth-bottom">

            Don't have an account?

            <a href="register.html">
                Register here
            </a>

        </p>

    </div>

</main>

<script src="../assets/js/employer.js"></script>

</body>
</html>
