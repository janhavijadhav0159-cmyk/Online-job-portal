<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Register - Job Portal</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/employer.css">
</head>

<body>

<header class="user-header">
    <div class="header-inner">
        <div class="logo">JobPortal</div>

        <nav class="nav">
            <a href="../index.html">Home</a>
            <a href="../jobs.html">Jobs</a>
            <a href="../companies.html">Companies</a>
            <a href="../about.html">About</a>
            <a href="../contact.html">Contact</a>
            <a href="login.html" class="join-btn">Login</a>
        </nav>
    </div>
</header>

<main class="auth-container">

    <div class="auth-box">

        <h1>Employer Registration</h1>
        <p class="auth-subtitle">Create your company account</p>

        <form id="employerRegisterForm">

            <div class="form-group">
                <label>Company Name</label>
                <input type="text" id="companyName" placeholder="Enter company name" required>
            </div>

            <div class="form-group">
                <label>Employer Name</label>
                <input type="text" id="employerName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="employerEmail" placeholder="Enter email" required>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="employerPhone" placeholder="Enter phone number" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="employerPassword" placeholder="Enter password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmEmployerPassword" placeholder="Confirm password" required>
            </div>

            <button type="submit" class="primary-btn">
                Register
            </button>

        </form>

        <p class="auth-bottom">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

    </div>

</main>

<script src="../assets/js/employer.js"></script>

</body>
</html>
