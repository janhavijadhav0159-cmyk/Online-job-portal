<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Profile - JobPortal</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css">

    <link
        rel="stylesheet"
        href="../assets/css/user.css">

</head>

<body class="user-page">


<header class="header">

    <div class="header-inner">

        <a href="../index.html" class="logo">
            JobPortal
        </a>

        <nav class="nav">

            <a href="../index.html">
                Home
            </a>

            <a href="../jobs.html">
                Jobs
            </a>

            <a href="../companies.html">
                Companies
            </a>

            <a href="../contact.html">
                Contact
            </a>

            <a href="#" class="logout-btn join-btn">
                Logout
            </a>

        </nav>

    </div>

</header>


<main class="user-main">

    <div class="user-grid">


        <aside class="user-sidebar">

            <div class="user-info">

                <div class="user-avatar">
                    J
                </div>

                <h3>
                    Job Seeker
                </h3>

                <p>
                    jobseeker@example.com
                </p>

            </div>


            <ul class="user-menu">

                <li>
                    <a href="dashboard.html">
                        🏠 Dashboard
                    </a>
                </li>

                <li>
                    <a href="profile.html" class="active">
                        👤 My Profile
                    </a>
                </li>

                <li>
                    <a href="jobs.html">
                        🔎 Find Jobs
                    </a>
                </li>

                <li>
                    <a href="applications.html">
                        📄 Applications
                    </a>
                </li>

                <li>
                    <a href="saved-jobs.html">
                        ❤️ Saved Jobs
                    </a>
                </li>

                <li>
                    <a href="resume.html">
                        📑 My Resume
                    </a>
                </li>

            </ul>

        </aside>


        <section class="user-content">

            <div class="profile-header">

                <div class="profile-large-avatar">
                    J
                </div>

                <div>

                    <h1>
                        My Profile
                    </h1>

                    <p>
                        Manage your personal information
                    </p>

                </div>

            </div>


            <div class="user-card">

                <form
                    class="user-form"
                    id="profileForm">


                    <div class="form-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            value="your first name"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="lastName">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            value="your last name"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            value="your email"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            value="+91 **********">

                    </div>


                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            value="your city">

                    </div>


                    <div class="form-group">

                        <label for="qualification">
                            Qualification
                        </label>

                        <select id="qualification">

                            <option selected>
                                B.Sc Computer Science
                            </option>

                            <option>
                                BCA
                            </option>

                            <option>
                                BE
                            </option>

                            <option>
                                B.Tech
                            </option>

                        </select>

                    </div>


                    <div class="form-group full">

                        <label for="skills">
                            Skills
                        </label>

                        <input
                            type="text"
                            id="skills"
                            value="HTML, CSS, JavaScript, C, C++, Java, Python, MySQL">

                    </div>


                    <div class="form-group full">

                        <label for="bio">
                            About Me
                        </label>

                        <textarea id="bio">I am a Computer Science student interested in web development and software development.</textarea>

                    </div>


                    <div class="form-group full">

                        <button
                            type="submit"
                            class="primary-btn">
                            Update Profile
                        </button>

                    </div>

                </form>


                <p id="profileMessage"></p>

            </div>

        </section>

    </div>

</main>


<script src="../assets/js/user.js"></script>

</body>
</html>
