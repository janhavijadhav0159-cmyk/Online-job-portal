<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Registration - JobPortal</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/user.css">
</head>

<body class="auth-page">

<header class="header">
    <div class="header-inner">

        <a href="../index.html" class="logo">
            JobPortal
        </a>

        <nav class="nav">
            <a href="../index.html">Home</a>
            <a href="../jobs.html">Jobs</a>
            <a href="../companies.html">Companies</a>
            <a href="../about.html">About</a>
            <a href="../contact.html">Contact</a>
        </nav>

    </div>
</header>


<main class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            JobPortal
        </div>

        <h1>
            Create Account
        </h1>

        <p class="auth-subtitle">
            Register as a job seeker
        </p>


        <form class="auth-form" id="registerForm">

            <div>
                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required>
            </div>


            <div>
                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>
            </div>


            <div>
                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required>
            </div>


            <div>
                <label for="qualification">
                    Qualification
                </label>

                <select id="qualification" required>

                    <option value="">
                        Select Qualification
                    </option>

                    <option value="BSc CS">
                        B.Sc Computer Science
                    </option>

                    <option value="BCA">
                        BCA
                    </option>

                    <option value="BE">
                        BE
                    </option>

                    <option value="BTech">
                        B.Tech
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>
            </div>


            <div>
                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        data-target="password">
                        Show
                    </button>

                </div>
            </div>


            <div>
                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        data-target="confirmPassword">
                        Show
                    </button>

                </div>
            </div>


            <button
                type="submit"
                class="auth-button">
                Register
            </button>

        </form>


        <p id="registerMessage"></p>


        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>

</main>


<script src="../assets/js/user.js"></script>

</body>
</html>
